<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start a meeting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3DDCFF}a:hover{color:#BBEFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0E13; color: #E0E2EA; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden;">
  <div aria-hidden="true" style="position: absolute; left: 45px; top: 120px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(255,107,107,0.14) 0%, rgba(255,107,107,0) 65%);"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px; position: relative;">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #262A30; background: #12161B; color: #BBC9CE; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600;">Record a meeting</div>
    <div style="width: 44px;"></div>
  </div>

  <!-- title -->
  <div style="padding: 18px 20px 0; position: relative;">
    <label for="mt" style="display: block; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px; color: #8E9CA1; margin-bottom: 8px;">WHAT IS IT? (OPTIONAL)</label>
    <input id="mt" value="Site meeting with Mr Ade" style="width: 100%; box-sizing: border-box; height: 56px; padding: 0 18px; border-radius: 28px; background: #12161B; border: 1px solid #2B3A40; color: #FFFFFF; font-size: 17px; font-family: 'Inter', sans-serif; outline: none;">
  </div>

  <!-- source -->
  <div style="padding: 20px 20px 0; position: relative;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px; color: #8E9CA1; margin-bottom: 10px;">LISTEN WITH</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <button style="height: 112px; border-radius: 20px; border: 1px solid #3DDCFF; background: rgba(61,220,255,0.08); color: #E0E2EA; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 14px; text-align: left;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3DDCFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600;">Phone</span><span style="font-size: 12px; color: #8E9CA1;">On the table — hears the room</span></span>
      </button>
      <button style="height: 112px; border-radius: 20px; border: 1px solid #262A30; background: #12161B; color: #E0E2EA; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 14px; text-align: left;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#BBC9CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="14" r="3.5"/><circle cx="18" cy="14" r="3.5"/><path d="M9.5 14h5"/></svg>
        <span style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600;">Glasses</span><span style="font-size: 12px; color: #8E9CA1;">Hears you best</span></span>
      </button>
    </div>
  </div>

  <!-- consent -->
  <div style="margin: 20px 20px 0; padding: 16px; border-radius: 20px; background: rgba(255,180,84,0.08); border: 1px solid rgba(255,180,84,0.3); display: flex; gap: 12px; position: relative;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFB454" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 3l9 16H3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>
    <span style="font-size: 14px; line-height: 20px; color: #E0E2EA;">Tell everyone you're recording before you start. JARVIS keeps the transcript and summary; the audio for 90 days.</span>
  </div>

  <!-- start -->
  <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-bottom: 34px; position: relative;">
    <button aria-label="Start recording" style="width: 120px; height: 120px; border-radius: 60px; border: 3px solid rgba(255,107,107,0.4); background: transparent; display: flex; align-items: center; justify-content: center; padding: 0;">
      <span style="width: 92px; height: 92px; border-radius: 46px; background: radial-gradient(circle at 35% 30%, #FF9A9A 0%, #FF5C5C 55%, #B42323 100%); box-shadow: 0 0 40px rgba(255,92,92,0.5); display: block;"></span>
    </button>
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600;">Start recording</span>
    <span style="font-size: 13px; color: #8E9CA1;">or say “Jarvis, record this meeting”</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
