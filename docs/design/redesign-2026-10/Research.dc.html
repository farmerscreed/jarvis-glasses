<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Research</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3DDCFF}a:hover{color:#BBEFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0E13; color: #E0E2EA; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <div aria-hidden="true" style="position: absolute; right: -80px; top: 60px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(255,180,84,0.10) 0%, rgba(255,180,84,0) 65%);"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px; position: relative;">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #262A30; background: #12161B; color: #BBC9CE; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600;">Research</div>
    <div style="width: 44px;"></div>
  </div>

  <!-- the question -->
  <div style="padding: 18px 20px 0; position: relative;">
    <label for="q" style="display: block; font-family: 'Space Grotesk', sans-serif; font-size: 26px; line-height: 32px; font-weight: 500; margin-bottom: 14px;">What do you want to know?</label>
    <div style="border-radius: 24px; background: #12161B; border: 1px solid #2B3A40; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 12px;">
      <textarea id="q" rows="2" style="border: none; background: transparent; color: #FFFFFF; font-family: 'Inter', sans-serif; font-size: 17px; line-height: 24px; resize: none; outline: none;">Price of a 5 kVA inverter in Port Harcourt</textarea>
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #6F7D82;">SEARCHES THE WEB · CITES SOURCES</span>
        <div style="display: flex; gap: 8px;">
          <button aria-label="Speak your question" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2B3A40; background: transparent; color: #BBC9CE; display: flex; align-items: center; justify-content: center; padding: 0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
          </button>
          <button aria-label="Research it" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #3DDCFF; color: #00222A; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 0 18px rgba(61,220,255,0.35);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- look & research -->
  <div style="padding: 14px 20px 0; position: relative;">
    <button style="width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; border: 1px solid rgba(255,180,84,0.35); background: linear-gradient(135deg, rgba(255,180,84,0.12) 0%, rgba(255,180,84,0.03) 100%); color: #E0E2EA; text-align: left;">
      <span style="width: 48px; height: 48px; border-radius: 16px; background: rgba(255,180,84,0.16); color: #FFB454; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600;">Research what I’m looking at</span>
        <span style="font-size: 13px; color: #9AA8AD;">Glasses take a photo — price, where to buy, reviews</span>
      </span>
    </button>
  </div>

  <!-- quick starts -->
  <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 20px 0; position: relative;">
    <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #2B3A40; background: transparent; color: #BBC9CE; font-size: 13px;">Price of…</button>
    <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #2B3A40; background: transparent; color: #BBC9CE; font-size: 13px;">Where to buy…</button>
    <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #2B3A40; background: transparent; color: #BBC9CE; font-size: 13px;">Compare…</button>
    <button style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #2B3A40; background: transparent; color: #BBC9CE; font-size: 13px;">Latest on…</button>
  </div>

  <!-- recent -->
  <div style="padding: 22px 20px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px; color: #8E9CA1; position: relative;">RECENT RESEARCH</div>
  <div style="margin: 0 20px; border-radius: 20px; background: #12161B; border: 1px solid #1F262B; overflow: hidden; position: relative;">
    <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: none; border-bottom: 1px solid #1A2026; background: transparent; color: #E0E2EA; text-align: left;">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 15px;">Standing fan, 16–18 inch</span>
        <span style="font-size: 12px; color: #8E9CA1;">Yesterday · ₦45,000–₦60,000 · from a photo</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F7D82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: none; border-bottom: 1px solid #1A2026; background: transparent; color: #E0E2EA; text-align: left;">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 15px;">Baby cot with drop-side rails</span>
        <span style="font-size: 12px; color: #8E9CA1;">10 Oct · ₦85,000–₦140,000 · from a photo</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F7D82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: none; background: transparent; color: #E0E2EA; text-align: left;">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 15px;">Pepper greenhouse drip kits</span>
        <span style="font-size: 12px; color: #8E9CA1;">8 Oct · 4 sources</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6F7D82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
