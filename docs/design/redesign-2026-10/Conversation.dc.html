<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Face to face</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3DDCFF}a:hover{color:#BBEFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0E13; color: #E0E2EA; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; gap: 10px; padding: 16px 14px 20px; position: relative; overflow: hidden;">

  <!-- THEIR half (faces across the table: upside-down) -->
  <div style="flex: 1 1 0; border-radius: 28px; background: linear-gradient(180deg, #11181D 0%, #0F1418 100%); border: 1px solid #22313A; transform: rotate(180deg); display: flex; flex-direction: column; padding: 22px; gap: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1px; color: #8E9CA1;">FRANÇAIS</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #3DDCFF;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        de la part de Law
      </span>
    </div>
    <div style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; line-height: 38px; font-weight: 500; color: #FFFFFF;">Le magasin est-il encore ouvert ?</div>
    <div style="margin-top: auto; font-size: 15px; line-height: 22px; color: #6F7D82;">Vous : « Oui, jusqu'à dix-huit heures. »</div>
  </div>

  <!-- turn indicator -->
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 4px;">
    <button aria-label="Turn their side upright" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #262A30; background: #12161B; color: #BBC9CE; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16"/><path d="M4 7l3-3 3 3"/><path d="M17 20V4"/><path d="M14 17l3 3 3-3"/></svg>
    </button>
    <div style="flex-grow: 1; height: 44px; border-radius: 22px; background: rgba(61,220,255,0.10); border: 1px solid rgba(61,220,255,0.45); box-shadow: 0 0 22px rgba(61,220,255,0.18); display: flex; align-items: center; justify-content: center; gap: 10px;">
      <span aria-hidden="true" style="display: flex; align-items: center; gap: 3px;">
        <span style="width: 3px; height: 8px; border-radius: 2px; background: #3DDCFF;"></span>
        <span style="width: 3px; height: 16px; border-radius: 2px; background: #3DDCFF;"></span>
        <span style="width: 3px; height: 11px; border-radius: 2px; background: #3DDCFF;"></span>
        <span style="width: 3px; height: 18px; border-radius: 2px; background: #BBEFFF;"></span>
        <span style="width: 3px; height: 9px; border-radius: 2px; background: #3DDCFF;"></span>
      </span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: #BBEFFF;">Your turn — speak English</span>
    </div>
    <button aria-label="Full transcript" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #262A30; background: #12161B; color: #BBC9CE; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
    </button>
  </div>

  <!-- YOUR half -->
  <div style="flex: 1 1 0; border-radius: 28px; background: #12161B; border: 1px solid #1F262B; display: flex; flex-direction: column; padding: 22px; gap: 12px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 1px; color: #8E9CA1;">ENGLISH · YOU</span>
    <div style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 36px; font-weight: 500; color: #3DDCFF;">Is the shop still open?</div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6F7D82;">THEY SAID · Le magasin est-il encore ouvert ?</div>
    <button style="margin-top: auto; align-self: flex-start; display: flex; align-items: center; gap: 8px; border: none; background: none; padding: 0; color: #9AA8AD; font-size: 14px; text-align: left;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
      You said “Yes, until six.” · tap to fix
    </button>
  </div>

  <!-- dock -->
  <div style="display: flex; align-items: center; gap: 10px;">
    <button aria-label="Type to them" style="width: 52px; height: 52px; border-radius: 26px; border: 1px solid #262A30; background: #12161B; color: #BBC9CE; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h1"/><path d="M10 10h1"/><path d="M14 10h1"/><path d="M8 14h8"/></svg>
    </button>
    <button style="flex-grow: 1; height: 52px; border-radius: 26px; border: 1px solid #2B3A40; background: #12161B; color: #E0E2EA; font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h2"/><path d="M6 8v8"/><path d="M10 5v14"/><path d="M14 8v8"/><path d="M18 10v4"/></svg>
      Just listen
    </button>
    <button aria-label="Stop translating" style="width: 52px; height: 52px; border-radius: 26px; border: 1px solid rgba(255,180,171,0.45); background: rgba(147,0,10,0.18); color: #FFB4AB; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
