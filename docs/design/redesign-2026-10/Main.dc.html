<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Translate home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3DDCFF}a:hover{color:#BBEFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0E13; color: #E0E2EA; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <!-- ambient glow -->
  <div aria-hidden="true" style="position: absolute; left: 45px; top: 150px; width: 300px; height: 300px; border-radius: 50%; background: radial-gradient(circle, rgba(61,220,255,0.18) 0%, rgba(61,220,255,0.05) 45%, rgba(61,220,255,0) 70%);"></div>

  <!-- top bar -->
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 8px; position: relative;">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #262A30; background: #12161B; color: #BBC9CE; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600; letter-spacing: 0.5px;">Translate</div>
    <button aria-label="Past conversations" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #262A30; background: #12161B; color: #BBC9CE; display: flex; align-items: center; justify-content: center; padding: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
    </button>
  </div>

  <!-- language pill -->
  <div style="display: flex; justify-content: center; padding-top: 10px; position: relative;">
    <button style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #2B3A40; background: rgba(61,220,255,0.06); color: #BBEFFF; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.5px;">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #3DDCFF; box-shadow: 0 0 8px #3DDCFF;"></span>
      ANY LANGUAGE → ENGLISH
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <!-- hero: listen -->
  <div style="display: flex; flex-direction: column; align-items: center; padding-top: 34px; position: relative;">
    <div style="width: 244px; height: 244px; border-radius: 50%; border: 1px solid rgba(61,220,255,0.18); display: flex; align-items: center; justify-content: center;">
      <div style="width: 212px; height: 212px; border-radius: 50%; border: 1px solid rgba(61,220,255,0.32); display: flex; align-items: center; justify-content: center;">
        <button aria-label="Start listening" style="width: 176px; height: 176px; border-radius: 50%; border: none; background: radial-gradient(circle at 35% 30%, #BBEFFF 0%, #3DDCFF 38%, #0B8FB0 100%); box-shadow: 0 0 48px rgba(61,220,255,0.55), inset 0 -8px 24px rgba(0,54,65,0.45); color: #00222A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0;">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h2"/><path d="M6 8v8"/><path d="M10 4v16"/><path d="M14 7v10"/><path d="M18 9v6"/><path d="M22 12h-2"/></svg>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700;">Listen</span>
        </button>
      </div>
    </div>
    <div style="margin-top: 18px; font-size: 16px; color: #E0E2EA; text-align: center;">Hear any language in English</div>
    <div style="margin-top: 6px; font-size: 13px; color: #8E9CA1; display: flex; align-items: center; gap: 6px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="14" r="3.5"/><circle cx="18" cy="14" r="3.5"/><path d="M9.5 14h5"/><path d="M2.5 13l1.5-5h3"/><path d="M21.5 13l-1.5-5h-3"/></svg>
      or double-tap your glasses
    </div>
  </div>

  <!-- mode tiles -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 34px 20px 0; position: relative;">
    <button style="height: 128px; border-radius: 22px; border: 1px solid #262A30; background: linear-gradient(180deg, #181C21 0%, #12161B 100%); color: #E0E2EA; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 16px 14px; text-align: left;">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: rgba(61,220,255,0.12); color: #3DDCFF; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a7 7 0 0 1-10.5 6L4 20l2-5.5A7 7 0 1 1 21 12z"/><path d="M8.5 11h7"/><path d="M8.5 14h4"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600;">Talk</span>
        <span style="font-size: 12px; color: #8E9CA1;">Two-way chat</span>
      </span>
    </button>
    <button style="height: 128px; border-radius: 22px; border: 1px solid #262A30; background: linear-gradient(180deg, #181C21 0%, #12161B 100%); color: #E0E2EA; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 16px 14px; text-align: left;">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,180,84,0.12); color: #FFB454; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3"/><path d="M16 4h3a1 1 0 0 1 1 1v3"/><path d="M20 16v3a1 1 0 0 1-1 1h-3"/><path d="M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 10h8"/><path d="M8 14h5"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600;">Read</span>
        <span style="font-size: 12px; color: #8E9CA1;">Signs &amp; menus</span>
      </span>
    </button>
    <button style="height: 128px; border-radius: 22px; border: 1px solid #262A30; background: linear-gradient(180deg, #181C21 0%, #12161B 100%); color: #E0E2EA; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 16px 14px; text-align: left;">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: rgba(187,239,255,0.10); color: #BBEFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600;">Say</span>
        <span style="font-size: 12px; color: #8E9CA1;">A phrase for them</span>
      </span>
    </button>
  </div>

  <!-- last session -->
  <div style="padding: 20px 20px 0; position: relative;">
    <button style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; border: 1px solid #1F262B; background: #11151A; color: #E0E2EA; text-align: left;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #3DDCFF; border: 1px solid #2B3A40; border-radius: 8px; padding: 4px 7px;">FR</span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 14px;">Last: French · 3 min</span>
        <span style="font-size: 12px; color: #8E9CA1;">Summary saved to your memory</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E9CA1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
